services:
  captcha-solver:
    image: localhost/captcha-solver:latest
    container_name: tools-solvers-captcha-solver
    init: true
    restart: always
    network_mode: "host"
    user: "1000:1000"
    userns_mode: "keep-id"
    environment:
      PORT: "8877"
      BROWSER_HEADLESS: "0"
      TURNSTILE_OFFLOAD_ENABLED: "1"
      TURNSTILE_OFFLOAD_URL: "http://127.0.0.1:8878/solve"
      TURNSTILE_OFFLOAD_TIMEOUT: "60"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8877/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
